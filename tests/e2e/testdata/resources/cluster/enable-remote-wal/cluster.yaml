apiVersion: greptime.io/v1alpha1
kind: GreptimeDBCluster
metadata:
  name: e2e-cluster-enable-remote-wal
  namespace: default
spec:
  initializer:
    image: localhost:5001/greptime/greptimedb-initializer:latest
  base:
    main:
      image: localhost:5001/greptime/greptimedb:latest
  frontend:
    replicas: 1
  meta:
    replicas: 1
    backendStorage:
      etcd:
        storeKeyPrefix: e2e-cluster-enable-remote-wal
        endpoints:
          - "etcd.etcd-cluster.svc.cluster.local:2379"
        storeKeyPrefix: "e2e-cluster-enable-remote-wal"
  datanode:
    replicas: 3
  wal:
    kafka:
      brokerEndpoints:
        - kafka.kafka:9092
      sasl:
        type: PLAIN
        username: greptime
        password: gt-operator-e2e
  httpPort: 4000
  rpcPort: 4001
  mysqlPort: 4002
  postgreSQLPort: 4003
